[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "type-cast-generator"
version = "0.1.0"
description = "Type Cast — offline video generation driver for the installation."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.23",
    # scope-attention-bender is intentionally NOT listed as a hard
    # dependency. Its install pulls scope + torch + CUDA — a heavy
    # GPU-machine-only chain. Install it manually in the env where
    # you actually run generation:
    #
    #   pip install -e /Users/adamcole/dev/scope-attention-bender
    #
    # ``python -m generator dry-run`` works without it (the StubAdapter
    # in pipeline_factory.py has no bender import).
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
type-cast = "generator.cli:main"

[tool.setuptools.packages.find]
include = ["generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
