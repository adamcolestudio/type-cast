# Seed hunt — find the best RNG seed for each prompt BEFORE committing to a
# full bending sweep.
#
# How it works: bending is held OFF (bending_base.bending_enabled: false) and
# only the seed varies cell-to-cell (sweep kind: seed). So each output is a
# pure baseline render at a different noise seed. Each video is named by its
# seed — prompt-NN_seed-<value>.mp4 — and the seed is ALSO recorded in
# manifest.json (top-level "seed" per video), so the file you pick maps
# straight back to a number you can pin.
#
# Run it:
#   type-cast run experiments/seed_hunt.yaml
#   # Preview the matrix first, no GPU:
#   type-cast run experiments/seed_hunt.yaml --dry-run
#   # Sanity-check the parsed spec + video count:
#   type-cast validate experiments/seed_hunt.yaml
#
# Then: eyeball the prompt-NN_seed-<value>.mp4 files, pick the best-looking
# seed, and pin that number in your real experiment's `video.seed` (applies to
# all prompts) or a per-prompt `seed:` (one prompt only).
#
# Matrix: 2 prompts x 8 seeds = 16 videos (no bands, no separate baseline).

name: seed_hunt
model: longlive

pipeline_init:
  width: 800
  height: 480
  num_frame_per_block: 8
  local_attn_size: 32

video:
  frames: 161           # ~5s at 16 fps — long enough to judge a seed
  fps: 16
  seed: 100            # default/manifest seed; the sweep overrides it per-cell
  encode_crf: 16

prompts:
  - name: femme
    text: "Black-and-white classic Hollywood cinema, 1930s, fine film grain, soft diffused key light with a glow on her hair, dramatic zoom from full body to close-up of a glamorous leading lady in an ornate gown and diamond earrings, carefully touching up her lipstick, cinematic, shot on 35mm film"

  - name: spaceman
    text: "A spaceman in a bubble helmet walking slowly across the surface of the moon, in a classic Hollywood science fiction film, starry black sky and distant earth, lurid retro color, grainy vintage film, cinematic, shot on 35mm film"

  - name: scream
    text: "Close-up of a frightened woman with long dark hair pressing both hands to her face and screaming in complete terror, in a classic 1970s Hollywood horror film, dark haunted house at night, ominous deep shadows, cold dim light, grainy vintage film, cinematic, shot on 35mm film"

  - name: austen
    text: "A woman in a Regency gown running through a green meadow, in a classic Hollywood period romance, soft natural light, grainy vintage film, cinematic, shot on 35mm film"

  - name: crooner
    text: "A dashing handsome crooner in a white tuxedo jacket singing into a vintage microphone, in a classic Hollywood musical, smoky nightclub, moody spotlight and atmospheric haze, grainy vintage film, cinematic, shot on 35mm film"

  - name: gladiator
    text: "Close-up of a fierce gladiator raising his sword to fight a lion, in a classic Hollywood epic, sandy colosseum arena, dust and dramatic sunlight, grainy vintage film, cinematic, shot on 35mm film"

  - name: vampire
    text: "A handsome aristocratic vampire in a black cape baring his fangs as he rises from a coffin, in a classic 1930s Hollywood horror film, candlelit castle, soft gothic shadows, grainy vintage film, cinematic, shot on 35mm film"

  - name: melodrama
    text: "Lush 1950s technicolor Hollywood melodrama, glossy saturated color, close-up of a weeping woman in an elegant satin gown with tears streaming down her face, ornate period living room, dramatic jewel-toned lighting, grainy vintage film, cinematic, shot on 35mm film"

  - name: glamourgirl
    text: "A glamorous starlet in a swirling satin gown dancing across a grand musical stage, in a classic Hollywood technicolor musical, lavish Art Deco set with sweeping staircases, bright theatrical lighting, grainy vintage film, cinematic, shot on 35mm film"

  - name: princess
    text: "A fairytale princess in a shimmering blue ball gown running down a grand palace staircase at midnight, in a classic Hollywood fantasy film, sparkling marble steps, magical glowing light, grainy vintage film, cinematic, shot on 35mm film"

  # --- dancer: three options, since waltz + chorus both drifted modern ---

  - name: dancer_tap
    text: "A tap dancer in a top hat and tails dancing down a grand staircase, in a classic Hollywood musical, glittering Art Deco set, bright spotlight, grainy vintage film, cinematic, shot on 35mm film"

  - name: dancer_baroque
    text: "An elegant couple in lavish baroque costumes and powdered wigs dancing a stately minuet, in a classic Hollywood period film, candlelit Versailles palace ballroom, golden chandelier light, grainy vintage film, cinematic, shot on 35mm film"

  - name: dancer_chorus
    text: "A row of 1930s chorus girls in matching sequined costumes kicking in unison, Busby Berkeley spectacle, in a classic Hollywood musical, lavish Art Deco stage, sparkling footlights, grainy vintage film, cinematic, shot on 35mm film"

# Bending OFF — this is a pure baseline seed hunt. (To instead find the best
# seed for a SPECIFIC bend, enable bending here and add the bend's params,
# e.g. ffn_output_scale, exactly as in your real experiment YAML.)
bending_base:
  bending_enabled: false

# Vary the seed cell-to-cell. Either list seeds explicitly:
sweep:
  kind: seed
  seeds: [100, 101, 102, 103]


  # ...or use the range shorthand instead of the list above:
  # start: 100
  # count: 8
  # step: 1

# The seeds ARE the videos here, so no separate baseline is needed.
baseline:
  per_prompt: false

merge: false

output_dir: /home/adam/mnt/ssd/typecast_runs

