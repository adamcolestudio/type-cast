# Seed hunt — find the best RNG seed for each prompt BEFORE committing to a
# full bending sweep.
#
# How it works: bending is held OFF (bending_base.bending_enabled: false) and
# only the seed varies cell-to-cell (sweep kind: seed). So each output is a
# pure baseline render at a different noise seed. Each video is named by its
# seed — prompt-NN_seed-<value>.mp4 — and the seed is ALSO recorded in
# manifest.json (top-level "seed" per video), so the file you pick maps
# straight back to a number you can pin.
#
# Run it:
#   type-cast run experiments/seed_hunt.yaml
#   # Preview the matrix first, no GPU:
#   type-cast run experiments/seed_hunt.yaml --dry-run
#   # Sanity-check the parsed spec + video count:
#   type-cast validate experiments/seed_hunt.yaml
#
# Then: eyeball the prompt-NN_seed-<value>.mp4 files, pick the best-looking
# seed, and pin that number in your real experiment's `video.seed` (applies to
# all prompts) or a per-prompt `seed:` (one prompt only).
#
# Matrix: 2 prompts x 8 seeds = 16 videos (no bands, no separate baseline).

name: seed_hunt
model: longlive

pipeline_init:
  width: 800
  height: 480
  num_frame_per_block: 8
  local_attn_size: 32

video:
  frames: 161           # ~5s at 16 fps — long enough to judge a seed
  fps: 16
  seed: 100            # default/manifest seed; the sweep overrides it per-cell
  encode_crf: 16

prompts:
  - name: femme
    text: "Black-and-white classic Hollywood cinema, 1930s, fine film grain, soft diffused key light with a glow on her hair, in the style of Bette Davis, dramatic zoom from full body to close-up of a glamorous leading lady in an ornate ballgown and diamond earrings, carefully touching up her lipstick, cinematic, shot on 35mm film"
    seed: 103

  - name: vampire
    text: "A handsome aristocratic vampire in a black cape rising from a coffin and spreading his arms wide to open his cape, fangs bared, in a classic 1930s Hollywood horror film, candlelit castle, soft gothic shadows, grainy vintage film, cinematic, shot on 35mm film"
    seed: 100

  - name: princess
    text: "Close-up of a fairytale princess in a shimmering blue ball gown and a crown hurrying down a grand palace staircase toward the camera at midnight, in a classic Hollywood fantasy film, sparkling marble steps, magical glowing light, grainy vintage film, cinematic, shot on 35mm film"

  - name: kiss_closeup
    text: "Black-and-white classic Hollywood cinema, 1940s, fine film grain, soft diffused light, extreme close-up of a handsome leading man and a glamorous leading lady in a passionate romantic kiss, lips and cheeks highlighted by dramatic shadows, cinematic, shot on 35mm film"
    seed: 101
  
  - name: cowboy_closeup
    text: "Extreme close-up of a rugged cowboy's eyes narrowing under his hat brim, then drawing his revolver, in a classic Hollywood western, dusty desert canyon, harsh golden light, grainy vintage film, cinematic, shot on 35mm film"
    seed: 

  - name: soldier_closeup
    text: "Close-up of a determined soldier's face as he shouts and waves his men forward, in a classic Hollywood war film, smoke and grit, overcast battlefield light, grainy vintage film, cinematic, shot on 35mm film"
    seed: 100


# Bending OFF — this is a pure baseline seed hunt. (To instead find the best
# seed for a SPECIFIC bend, enable bending here and add the bend's params,
# e.g. ffn_output_scale, exactly as in your real experiment YAML.)
bending_base:
  bending_enabled: false

# Vary the seed cell-to-cell. Either list seeds explicitly:
sweep:
  kind: seed
  seeds: [100, 101, 102, 103]


  # ...or use the range shorthand instead of the list above:
  # start: 100
  # count: 8
  # step: 1

# The seeds ARE the videos here, so no separate baseline is needed.
baseline:
  per_prompt: false

merge: false

output_dir: /home/adam/mnt/ssd/typecast_runs

