# Type Cast v1 — FFN output-scale-0 layer sweep, two prompts.
# Drafted from the spec confirmed in the planning round.
#
# Reads as: "for each of 28 overlapping 3-layer windows, run an
# uninterrupted generation where the FFN output is suppressed (scale=0)
# within that layer band. Hold seed + prompt constant. Add a no-bend
# baseline at the end. Concat per-prompt into one merged mp4."

name: type_cast_v1_ffn_output_scale_0
model: longlive

pipeline_init:
  width: 800
  height: 480
  # Optional LongLive AR knobs — uncomment to override scope's defaults and use single chunk, set frames to 81 and fps to 8
  # num_frame_per_block: 21
  # local_attn_size: 21
  # sink_size: 3 --> skip this

video:
  frames: 161         # ~10 s at 16 fps; matches your SETUP.md target
  fps: 16              # Pi 3B+ baseline (experimental per SETUP.md)
  seed: 102           # held constant across the entire matrix
  encode_crf: 16      # SETUP.md baseline; lower = better quality
  keep_frames: false  # set true to archive raw PNGs next to each mp4

prompts:
  - name: cowboy
    text: "Close-up of a rugged cowboy drawing his revolver, in a classic Hollywood western, golden desert light, cinematic"

  - name: femme
    text: "Close-up of a glamorous woman applying red lipstick, in a classic Hollywood film noir, dramatic shadows, cinematic"

  - name: reveal
    text: "Close-up of a woman lowering her sunglasses, in a classic Hollywood glamour film, soft studio light, cinematic"

  - name: vampire
    text: "A caped vampire baring his fangs, in a classic Hollywood horror film, candlelight and fog, cinematic"

  - name: kiss
    text: "Two lovers kissing in an embrace, in a classic Hollywood romance, sweeping golden light, cinematic"

  - name: spaceman
    text: "A spaceman raising his ray gun, in a classic Hollywood science fiction film, lurid retro color, cinematic"

  - name: scream
    text: "Close-up of a woman screaming in terror, in a classic Hollywood horror film, high-contrast shadows, cinematic"

  - name: crooner
    text: "A crooner in a tuxedo singing into a microphone, in a classic Hollywood musical, single spotlight, cinematic"

  - name: gladiator
    text: "A gladiator raising his sword to the crowd, in a classic Hollywood epic, dust and sunlight, cinematic"

  - name: detective
    text: "Close-up of a hard-boiled detective lighting a cigarette, in a classic Hollywood film noir, venetian-blind shadows, cinematic"

  - name: swashbuckler
    text: "A masked swordsman lunging in a duel, in a classic Hollywood swashbuckler, candlelight, cinematic"

  - name: dancer
    text: "A flamenco dancer snapping into a pose, in a classic Hollywood musical, dramatic spotlight, cinematic"

  - name: gangster
    text: "Close-up of a pinstriped gangster lighting a cigar, in a classic Hollywood crime film, smoky low light, cinematic"

  - name: soldier
    text: "A soldier rising from the trench waving his men forward, in a classic Hollywood war film, smoke and grit, cinematic"

  - name: pinup
    text: "A smiling pin-up girl blowing a kiss, in a classic Hollywood technicolor film, bright glamour light, cinematic"

  - name: mummy
    text: "A bandaged mummy reaching forward, in a classic Hollywood horror film, torchlight and shadow, cinematic"

  - name: aviator
    text: "Close-up of an aviator in goggles gripping the controls, in a classic Hollywood adventure film, cockpit light, cinematic"

  - name: showgirl
    text: "A showgirl in a feathered headdress descending a staircase, in a classic Hollywood musical, sparkling light, cinematic"

  - name: knight
    text: "A knight raising his sword toward a dragon, in a classic Hollywood fantasy film, mist and torchlight, cinematic"

  - name: jungle
    text: "A jungle hero swinging on a vine, in a classic Hollywood adventure film, lush green light, cinematic"

  - name: prophet
    text: "A robed prophet raising his arms as clouds part, in a classic Hollywood biblical epic, shafts of light, cinematic"

  - name: damsel
    text: "A damsel tied to railroad tracks struggling, in a classic Hollywood melodrama, dramatic lighting, cinematic"

# The DEFORMATION — applied identically to every band video. The sweep
# below dictates WHICH layers it acts on per video.
bending_base:
  bending_enabled: true
  ffn_output_scale: 0.0

# Sliding 3-layer window across all 30 FFN layers, stride 1.
# Produces 28 bands: [0,2], [1,3], …, [27,29].
sweep:
  kind: ffn_layer
  stride: 1
  window: 3
  # layer_start: 0      # default
  # layer_end: null     # null → use the model's actual layer count

baseline:
  per_prompt: true
  position: end

merge: true             # concat per-prompt videos into a single mp4

# Optional — where the experiment-run folder lands. Defaults to
# ``<yaml-dir>/../output/``. Set to an absolute path (e.g. an external
# SSD mount) when local disk is tight. ``--output`` CLI flag overrides.
# output_dir: /home/adam/mnt/ssd/typecast_runs
